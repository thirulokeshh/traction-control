<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%" fx="30%" fy="30%">
      <stop offset="0%" stop-color="#252529" />
      <stop offset="100%" stop-color="#050507" />
    </radialGradient>
    
    <!-- Neon Glow Gradient -->
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>

    <!-- Neon Cyan Shadow/Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Circle with smooth borders -->
  <rect width="128" height="128" rx="32" fill="url(#bgGrad)" stroke="#1f1f22" stroke-width="2" />
  
  <!-- Outer gauge ring -->
  <circle cx="64" cy="64" r="42" fill="none" stroke="#1f1f22" stroke-width="6" />
  
  <!-- Glowing active traction arc -->
  <path d="M 34.3 93.7 A 42 42 0 1 1 93.7 93.7" fill="none" stroke="url(#glowGrad)" stroke-width="6" stroke-linecap="round" filter="url(#glow)" />
  
  <!-- Glowing speed gauge needle / arrow -->
  <g transform="translate(64,64)" filter="url(#glow)">
    <!-- Rotating needle to indicate traction -->
    <path d="M 0 0 L -6 -6 L 0 -36 L 6 -6 Z" fill="#f97316" transform="rotate(35)" />
    <circle cx="0" cy="0" r="10" fill="#050507" stroke="#f97316" stroke-width="4" />
    <circle cx="0" cy="0" r="3" fill="#f97316" />
  </g>
</svg>
